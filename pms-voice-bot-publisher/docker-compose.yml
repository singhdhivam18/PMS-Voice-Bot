version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: car-service-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest/guest by default)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - car-service-net

  publisher-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-service-publisher-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"   # /health
    networks:
      - car-service-net

  # ---------------------------------------------------------------------
  # OPTIONAL: uncomment for a local/dev SQL Server instead of pointing
  # DB_SERVER at your already-existing database.
  # ---------------------------------------------------------------------
  # sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: car-service-sqlserver
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
  #   ports:
  #     - "1433:1433"
  #   networks:
  #     - car-service-net

networks:
  car-service-net:
    driver: bridge

volumes:
  rabbitmq_data:
